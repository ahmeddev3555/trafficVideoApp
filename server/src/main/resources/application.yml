server:
  servlet:
    context-path: /v1

spring:
  application:
    name: server
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  storage:
    # Relative to the server module's working directory (the `server/` folder, since
    # this Gradle project's own root is `server/`, not the repo root) - resolves to
    # `server/storage/videos`, matching the directory the repo's .gitignore expects.
    # Not a secret, so a sane default lives here rather than requiring every
    # environment to set it (unlike app.jwt.secret, which fails fast if unset).
    video-directory: "storage/videos"
  osm:
    nominatim-base-url: "https://nominatim.openstreetmap.org"
    overpass-base-urls:
      - "https://overpass-api.de/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://overpass.private.coffee/api/interpreter"
    overpass-per-endpoint-attempts: 1
    # OSM's usage policy requires an identifying User-Agent - set a real contact before
    # sending any production traffic.
    user-agent: "TrafficWatch-Server/1.0 (set a real contact in your environment)"
    connect-timeout-ms: 5000
    read-timeout-ms: 8000
    search-radius-meters: 50
    max-search-radius-meters: 200
    radius-accuracy-multiplier: 2.0
    lookup-retry-attempts: 3
    lookup-retry-delay-ms: 500
    cache-ttl-days: 30
  video-analysis:
    base-url: "http://localhost:8000"
    connect-timeout-ms: 5000
    read-timeout-ms: 180000
  analysis:
    wrong-way-tolerance-degrees: 60
    confirmation-threshold: 0.5
    agreement-tolerance-degrees: 45
    weak-evidence-floor: 0.2
    consensus-min-resultant-length: 0.6
    min-displacement-fraction: 0.15
    history-min-observations: 5
    history-min-distinct-reporters: 3
    history-min-resultant-length: 0.8
    approach-growth-min: 0.8
    approach-min-frames: 30
    approach-min-detection: 0.5
