version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trafficwatch-postgres
    environment:
      POSTGRES_DB: trafficwatch
      POSTGRES_USER: trafficwatch
      POSTGRES_PASSWORD: trafficwatch_dev_password
    ports:
      - "5432:5432"
    volumes:
      - trafficwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficwatch -d trafficwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trafficwatch-db:
